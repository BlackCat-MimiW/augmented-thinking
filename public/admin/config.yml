backend:
  name: github
  repo: BlackCat-MimiW/augmented-thinking
  branch: main


media_folder: public/images
public_folder: /images

collections:
  - name: articles
    label: 文章
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: 標題
        name: title
        widget: string
      - label: 描述
        name: description
        widget: string
        required: false
      - label: 分類
        name: category
        widget: select
        options:
          - label: AI工具
            value: ai-tools
          - label: 商業思維
            value: business
          - label: 社會觀察
            value: society
          - label: 投資理財
            value: investment
          - label: 教育觀點
            value: education
          - label: 經濟議題
            value: economy
          - label: 人文關懷
            value: humanity
          - label: Blog
            value: blog
          - label: 討論區
            value: discussion
      - label: 發布日期
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: 標籤
        name: tags
        widget: list
        default: []
      - label: 封面圖片
        name: image
        widget: image
        required: false
      - label: 閱讀時間（分鐘）
        name: minutesRead
        widget: number
        default: 5
      - label: 精選文章
        name: featured
        widget: boolean
        default: false
      - label: 草稿
        name: draft
        widget: boolean
        default: false
      - label: 內文
        name: body
        widget: markdown

  - name: appearance
    label: 外觀設定
    files:
      - label: 主題（字體 / 字級 / 顏色）
        name: theme
        file: src/data/theme.json
        fields:
          - label: 內文字體
            name: bodyFont
            widget: select
            default: Inter
            options:
              - Inter
              - Noto Sans TC
              - Lora
              - Merriweather
              - Nunito Sans
          - label: 標題字體
            name: headingFont
            widget: select
            default: Playfair Display
            options:
              - Playfair Display
              - Noto Serif TC
              - Source Serif 4
              - Lora
              - Merriweather
          - label: 基準字級（px，全站等比縮放）
            name: baseFontSize
            widget: number
            default: 16
            value_type: int
            min: 12
            max: 22
          - label: 顏色
            name: colors
            widget: object
            fields:
              - { label: 主標題色, name: ink, widget: color }
              - { label: 內文色, name: text, widget: color }
              - { label: 次要文字色, name: muted, widget: color }
              - { label: 重點色（金）, name: gold, widget: color }
              - { label: 強調色, name: accent, widget: color }
              - { label: 淺底色, name: mist, widget: color }
              - { label: 邊框色, name: border, widget: color }
              - { label: 背景色, name: background, widget: color }

  - name: settings
    label: 網站設定
    files:
      - label: 社群連結
        name: social
        file: src/data/social.json
        fields:
          - label: LinkedIn 網址
            name: linkedin
            widget: string
          - label: Instagram 網址
            name: instagram
            widget: string
          - label: Facebook 網址
            name: facebook
            widget: string
          - label: YouTube 網址
            name: youtube
            widget: string
          - label: Threads 網址
            name: threads
            widget: string
